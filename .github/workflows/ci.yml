name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: go vet ./...

      - run: go test ./...

      - name: Governance drift check
        shell: bash
        run: bash build/check-governance.sh

      - name: Release helper tests
        shell: bash
        run: bash build/release-helper-test.sh
