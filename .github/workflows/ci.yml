name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Governance drift check
        shell: bash
        run: bash build/check-governance.sh

      - name: Release static checks
        shell: bash
        run: |
          bash -n build/build.sh build/sign.sh build/release.sh build/check-governance.sh build/release-helper-test.sh
          python -m py_compile build/release-helper.py
          bash build/release.sh --dry-run 1.2.3-rc.1
          bash build/release.sh --dry-run 1.2.3

      - name: Signing client syntax check
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'build/sign-via-simplysign.ps1'),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | Format-List -Force
            exit 1
          }

      - name: Release helper tests
        shell: bash
        run: bash build/release-helper-test.sh

      - run: go vet ./...

      - run: go test -count=1 ./...
